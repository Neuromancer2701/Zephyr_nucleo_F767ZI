# Micro-ROS configuration
CONFIG_MICRO_ROS=y
CONFIG_MICRO_ROS_APP_STACK_SIZE=4096

# Serial/UART Console configuration
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_PRODUCT="Zephyr"
CONFIG_USB_DEVICE_VID=2fe3
CONFIG_USB_DEVICE_PID=0100
CONFIG_USB_DEVICE_MANUFACTURER="Zephyr"
CONFIG_USB_CDC_ACM=y
CONFIG_UART_LINE_CTRL=y


# Heap and memory configuration
CONFIG_HEAP_MEM_POOL_SIZE=8192
CONFIG_MAIN_STACK_SIZE=4096

# Enable C++ support for Micro-ROS
CONFIG_CPLUSPLUS=y
CONFIG_LIB_CPLUSPLUS=y

# SENSOR
CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_SPI=y

# Other configurations
CONFIG_ASSERT=y
CONFIG_PRINTK=y
